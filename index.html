<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tea Counter POS</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai+Looped:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF1EF;--sf:#fff;--ink:#12231D;--mute:#62756E;--line:#D9E2DE;--brand:#14795C;--on:#fff;--soft:#E1F0E9;--bad:#C8412F;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1613;--sf:#16211D;--ink:#E7F1ED;--mute:#8DA39B;--line:#263631;--brand:#3CC49A;--on:#06241B;--soft:#1D3029;--bad:#FF8570;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1613;--sf:#16211D;--ink:#E7F1ED;--mute:#8DA39B;--line:#263631;--brand:#3CC49A;--on:#06241B;--soft:#1D3029;--bad:#FF8570;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 'Noto Sans Thai Looped','Sarabun',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--sf);border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:18px;margin-right:auto}
.tabs{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:12px}
.tab{padding:10px 16px;border-radius:9px;font-weight:500;color:var(--mute)}
.tab.on{background:var(--brand);color:var(--on)}
.btn{padding:11px 16px;border-radius:12px;font-weight:600;background:var(--soft);color:var(--brand)}
.btn.pri{background:var(--brand);color:var(--on)}
.btn.bad{color:var(--bad)}
.btn.big{padding:15px 18px;font-size:17px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.pos{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;padding:16px;align-items:start}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px}
.cat{flex:none;padding:10px 18px;border-radius:99px;background:var(--sf);border:1px solid var(--line);font-weight:500}
.cat.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
.card{background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:transform .12s}
.card:active{transform:scale(.97)}
.pic{height:96px;border-radius:11px;display:grid;place-items:center;font-size:52px;background:hsl(var(--h) 55% 50%/.18)}
.card b{font-weight:600}
.price{color:var(--brand);font-weight:700}
.mut{color:var(--mute);font-size:14px}
.cart{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);background:var(--sf);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;max-height:calc(100dvh - 100px - env(safe-area-inset-top,0px))}
.cart-h{display:flex;justify-content:space-between;gap:8px;padding:16px;font-size:17px;width:100%;text-align:left}
.lines{overflow:auto;flex:1;padding:0 16px}
.ln{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.qty{display:flex;align-items:center;gap:2px}
.qty button{width:38px;height:38px;border-radius:10px;background:var(--bg);font-size:20px}
.qty span{min-width:28px;text-align:center;font-weight:600}
.cart-f{padding:16px;border-top:1px solid var(--line);display:grid;gap:10px}
.tot{display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:700}
.empty{padding:28px 0;text-align:center;color:var(--mute)}
.ov{position:fixed;inset:0;background:rgba(8,16,13,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.ov.on{display:flex}
.sheet{background:var(--sf);border-radius:20px;width:min(520px,100%);max-height:92dvh;overflow:auto;padding:22px;animation:pop .18s}
.sheet h3{margin:0 0 4px;font-size:20px}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{padding:10px 14px;border-radius:12px;border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;min-width:84px;font-weight:500}
.chip small{font-size:12px;color:var(--mute);min-height:17px}
.chip.on{border-color:var(--brand);background:var(--soft)}
.chip.on small{color:var(--brand);font-weight:700}
.foot{display:flex;gap:12px;align-items:center;margin-top:16px}
.foot .btn{flex:1}
.f{display:grid;gap:6px;margin-bottom:12px}
.f label{font-size:14px;color:var(--mute)}
.f input,.f textarea{padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qk{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.bigt{font-size:36px;font-weight:700;color:var(--brand)}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
h2{margin:0;font-size:22px}
.row{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.row .pic{height:56px;font-size:30px}
.acts{display:flex;gap:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:16px}
.stat b{display:block;font-size:30px}
.stat.main{background:var(--brand);color:var(--on);border-color:var(--brand)}
.panel{background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
.panel h3{margin:0 0 6px}
.bar{display:grid;grid-template-columns:1fr auto;gap:4px 10px;margin:12px 0}
.bar i{grid-column:1/3;height:8px;border-radius:9px;background:var(--bg);overflow:hidden}
.bar s{display:block;height:100%;background:var(--brand)}
.ord{display:grid;grid-template-columns:auto 1fr auto;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%) translateY(-16px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;opacity:0;transition:.2s;z-index:60;pointer-events:none;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%)}
@media(max-width:900px){
.pos{grid-template-columns:1fr;padding-bottom:96px}
.cart{position:fixed;left:8px;right:8px;top:auto;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-height:80dvh;transform:translateY(calc(100% - 60px));transition:transform .25s;z-index:15;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.cart.open{transform:none}
.cart-h{cursor:pointer}
.brand{display:none}
.tabs{flex:1}.tab{flex:1;padding:10px 6px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.pic{overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}
.gh{margin-top:14px}.gh+.chips{margin-top:8px}
.f select{padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.f label.ck{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:16px;padding:6px 0}
.rcpt{font-family:'Noto Sans Thai Looped',sans-serif;font-size:14px;padding:12px;border:1px dashed var(--line);border-radius:10px;background:#fff;color:#000;margin:12px 0}
.rcpt hr{border:0;border-top:1px dashed #000;margin:8px 0}
.rl{display:flex;justify-content:space-between;gap:10px}.rl.sm{font-size:12px;color:#444}.rl.b{font-weight:700}
.rc{text-align:center}.rc.big{font-size:18px;font-weight:700}
@media(max-width:900px){.tab{font-size:13px}}
/* print rules: see block at end of <style> */
body[data-role="cashier"] .own{display:none!important}
.alert{background:#C8412F;color:#fff;padding:10px 16px;font-weight:600}
.stin,#lowin{padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);width:100%}
.chip:disabled{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.tabs{overflow-x:auto}.tab{white-space:nowrap}.lines{min-height:90px}
.top .btn{padding:9px 12px;font-size:14px}
.pricing{display:grid;grid-template-columns:1fr 1fr;gap:12px;background:var(--soft);border-radius:14px;padding:14px;margin-bottom:12px}
.pf label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.pf small{display:block;color:var(--mute);margin-top:6px;font-size:12px}
.step{display:flex;align-items:stretch;background:var(--sf);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.step button{width:46px;font-size:22px;background:var(--bg);color:var(--brand)}
.step input{flex:1;min-width:0;border:0;text-align:center;font-weight:700;font-size:20px;background:transparent;padding:10px 0;-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.gprev{grid-column:1/3;font-size:14px;color:var(--mute)}
.pvs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pv{background:var(--sf);border:1px solid var(--line);border-radius:99px;padding:4px 12px;color:var(--ink)}
.pv.pay{border-color:var(--brand)}.pv b{color:var(--brand)}
.gh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.cnt{margin-left:auto;background:var(--soft);color:var(--brand);font-weight:600;font-size:13px;padding:2px 10px;border-radius:99px}
.cnt.over{background:var(--brand);color:var(--on)}
.brk{margin-top:12px;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:4px;font-size:14px}
.brk>div{display:flex;justify-content:space-between;gap:8px}
.brk .x{color:var(--brand);font-weight:600}
.brk .t{border-top:1px solid var(--line);padding-top:6px;font-weight:700;font-size:16px}
@media(max-width:520px){.pricing{grid-template-columns:1fr}.gprev{grid-column:1}}
.bp{color:var(--brand);font-weight:700;margin-left:4px}
.pricing{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 10px;padding:10px 12px;margin-bottom:8px}
.pf{min-width:0}
.pf label{font-size:13px;margin-bottom:4px;line-height:1.25}
.pf small{margin-top:4px;font-size:11px;line-height:1.3}
.step{max-width:150px;height:36px;border-radius:10px}
.step button{width:34px;flex:none;padding:0;font-size:18px}
.step input{flex:1 1 0;width:0;min-width:0;height:100%;padding:0;font-size:16px}
.gprev{grid-column:1/3;font-size:12px;line-height:1.35}
.pvs{gap:4px;margin-top:4px}
.pv{padding:2px 9px;font-size:12px}
.sheet .f{margin-bottom:8px;gap:4px}
.sheet .f input,.sheet .f textarea,.sheet .f select{padding:8px 10px}
@media(max-width:520px){.sheet{padding:16px}.pricing{grid-template-columns:repeat(2,minmax(0,1fr))}.gprev{grid-column:1/3}}
.brk .s{font-size:13px;color:var(--mute);padding-left:12px}
.orow{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,.7fr) minmax(0,.7fr) minmax(0,1.2fr) auto;gap:6px;align-items:end;padding:8px;margin-bottom:6px;background:var(--bg);border-radius:10px}
.oc{display:grid;gap:2px;min-width:0}.oc span{font-size:11px;color:var(--mute)}
.sheet .oc input{padding:7px 8px;font-size:15px;width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--sf)}
.ox{height:34px;padding:0 10px;border-radius:8px;background:var(--sf);color:var(--bad);font-size:13px;font-weight:600;white-space:nowrap}
#g-rows{max-height:40dvh;overflow:auto;margin-bottom:6px}
@media(max-width:560px){.orow{grid-template-columns:minmax(0,.8fr) minmax(0,.8fr) minmax(0,1.4fr) auto}.oc.on{grid-column:1/4}.ox{grid-column:4;grid-row:1}}
.brand{display:block!important;cursor:pointer;max-width:32vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbox{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--sf);margin-bottom:10px;font-size:16px}
.rrow{grid-template-columns:minmax(0,2fr) minmax(0,1fr) auto!important}
.rrow .ox{grid-column:auto!important;grid-row:auto!important}
.rrows{max-height:30dvh;overflow:auto;margin-bottom:6px}
.syncb{font-size:12px;padding:4px 10px;border-radius:99px;white-space:nowrap;background:var(--soft);color:var(--brand);font-weight:600}
.syncb.off{background:#C8412F;color:#fff}.syncb.wait{background:var(--bg);color:var(--mute)}
@media(max-width:560px){.syncb .t{display:none}}

/* ===== Receipt (thermal) ===== */
.rcpt{--rf:12px;--rw:48mm;--rp:2mm;width:var(--rw);margin:12px auto;padding:3mm var(--rp) 7mm;font-size:var(--rf);line-height:1.4;font-weight:400;border:1px dashed var(--line);border-radius:6px;background:#fff;color:#000}
.rcpt.p80{--rf:14px;--rw:72mm}
.rcpt hr{border:0;border-top:1px dashed #000;margin:1.6mm 0}
.rcpt .rl{display:flex;justify-content:space-between;align-items:flex-start;gap:2mm;break-inside:avoid}
.rcpt .rl>span:first-child{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.rcpt .rl>span:last-child{flex:none;white-space:nowrap;text-align:right}
.rcpt .rl.sm{font-size:1.12em;font-weight:500;color:#000;padding-left:2.5mm}
.rcpt .rl.b,.rcpt .rc.b{font-weight:700}
.rcpt .rc{text-align:center;break-inside:avoid;overflow-wrap:anywhere}
.rcpt .z-s{font-size:.85em}.rcpt .z-m{font-size:1.25em}.rcpt .z-l{font-size:1.35em}.rcpt .z-xl{font-size:1.6em;line-height:1.25}
.rcpt .rlogo{display:block;margin:0 auto 1.5mm;max-width:100%;max-height:26mm;object-fit:contain}
.rcpt .sp{height:2mm}
@media screen{.rcpt{zoom:1.5}}
@page{margin:0}
@media print{
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 html,body{background:#fff!important;margin:0!important;padding:0!important;height:auto!important}
 :root{padding:0!important}
 body::before,.top,main,#alert,#toast,.noprint{display:none!important}
 .ov{position:static!important;display:block!important;background:none!important;padding:0!important}
 .sheet{width:auto!important;max-width:none!important;max-height:none!important;overflow:visible!important;padding:0!important;margin:0!important;border-radius:0!important;background:#fff!important;animation:none!important}
 .rcpt{margin:0 auto!important;border:0!important;border-radius:0!important;zoom:1!important}
}
/* ===== QR payment ===== */
.qrbox{display:grid;justify-items:center;gap:4px;margin:14px 0 8px;text-align:center}
.qrimg{width:min(280px,72vw);aspect-ratio:1;object-fit:contain;background:#fff;padding:10px;border-radius:16px;border:1px solid var(--line)}
.qrnone{width:min(280px,72vw);aspect-ratio:1;display:grid;place-items:center;padding:16px;border:2px dashed var(--line);border-radius:16px;color:var(--mute)}
.qrl{color:var(--mute);font-size:16px;font-weight:500;margin-top:6px}
.qra{font-size:clamp(46px,14vw,76px);font-weight:800;line-height:1.05;color:var(--brand)}
.lgp{width:132px;height:84px;flex:none;border:1px dashed var(--line);border-radius:10px;display:grid;place-items:center;background:#fff;overflow:hidden;color:#62756E;font-size:13px}
.lgp img{max-width:100%;max-height:100%}
.ots{display:flex;gap:6px;flex-wrap:wrap}
.otb{flex:1 1 0;padding:9px 8px;border-radius:10px;border:2px solid var(--line);font-weight:600;font-size:14px;white-space:nowrap}
.otb.on{border-color:var(--brand);background:var(--soft);color:var(--brand)}
.otrow{grid-template-columns:minmax(0,1fr) auto!important}.otrow .ox{grid-column:auto!important;grid-row:auto!important}
.chip[data-act=tog]{font-size:19px;padding:12px 18px;min-width:104px}
.chip[data-act=tog] small{font-size:13px;min-height:18px}
.chip[data-act=tog] .bp{font-size:16px}
.gh b{font-size:19px}.gh .mut{font-size:15px}
.ln .mut{font-size:16px;line-height:1.45;color:var(--ink)}

/* ===== Login ===== */
#login{display:none;position:fixed;inset:0;z-index:90;background:var(--bg);overflow-y:auto;place-items:center;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px))}
body[data-auth="out"] #login{display:grid}
body[data-auth="out"] .top,body[data-auth="out"] main,body[data-auth="out"] #alert{visibility:hidden}
.lgbox{width:min(400px,100%);background:var(--sf);border:1px solid var(--line);border-radius:22px;padding:28px 22px;display:grid;gap:10px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.08)}
.lgbox h1{margin:0;font-size:26px}
.lglogo{font-size:56px;line-height:1.1}.lglogo img{max-height:84px;max-width:70%;object-fit:contain}
.lgstaff,.lgowner{width:100%}.lgstaff{margin-top:6px}
.lgowner{background:var(--ink);color:var(--bg)}
.lgdiv{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:14px;margin:6px 0}
.lgdiv::before,.lgdiv::after{content:'';flex:1;height:1px;background:var(--line)}
.lgbox .f{text-align:left;margin:0}.lgbox .f input{font-size:18px;padding:14px}
.lgerr{min-height:20px;color:var(--bad);font-size:14px}
.umrow{display:flex;gap:14px;align-items:center;margin:14px 0}.umi{font-size:36px}
.umb{width:100%;margin-bottom:10px;text-align:left}
/* ===== Switch ===== */
.swrow{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.swrow small{display:block;color:var(--mute);font-size:13px;margin-top:3px;line-height:1.4}
.sw{appearance:none;-webkit-appearance:none;flex:none;width:54px;height:32px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;transition:background .2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .2s}
.sw:checked{background:var(--brand)}.sw:checked::after{left:25px}
/* ===== Header: desktop ===== */
.tools{display:flex;align-items:center;gap:8px;flex:none}
.tabs{overflow:visible}
.ti,.ts{display:none}
.cart{top:calc(var(--hh,60px) + env(safe-area-inset-top,0px) + 12px);max-height:calc(100dvh - var(--hh,60px) - 28px - env(safe-area-inset-top,0px))}
#toast{top:calc(var(--hh,60px) + env(safe-area-inset-top,0px) + 8px)}
/* ===== Header: mobile / tablet (no horizontal scrolling) ===== */
@media(max-width:1000px){
 .top{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand tools" "tabs tabs";gap:6px 8px;padding:8px 10px}
 .brand{display:block;grid-area:brand;margin:0;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .tools{grid-area:tools}
 .tabs{grid-area:tabs;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;padding:3px}
 .tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:5px 2px;min-height:46px;font-size:11px;line-height:1.2;text-align:center}
 .ti{display:block;font-size:18px}.tl{display:none}.ts{display:block}
 .setbtn,.rt{display:none}
 .top .btn{min-height:42px}
 #rolebtn{min-width:46px}
}
@media(min-width:1001px){.rc{display:none}}
@media(max-width:900px){
 .pos{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
 .cart{top:auto;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-height:calc(100dvh - var(--hh,100px) - 24px - env(safe-area-inset-bottom,0px) - env(safe-area-inset-top,0px))}
}
.orow .spt{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:13px;line-height:1.35;padding-top:6px;border-top:1px dashed var(--line);cursor:pointer}
.sw-s{width:44px;height:26px}.sw-s::after{width:20px;height:20px}.sw-s:checked::after{left:21px}
/* ===== Members ===== */
.mrow{display:flex;gap:6px}
.mph{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.mbox{border:1px solid var(--brand);background:var(--soft);border-radius:12px;padding:10px 12px;display:grid;gap:8px}
.mtop{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.mpts{font-weight:700;color:var(--brand)}
.rdc{display:flex;flex-wrap:wrap;gap:6px}
.rdt{display:inline-flex;gap:6px;align-items:center;background:var(--sf);border:1px solid var(--brand);border-radius:99px;padding:3px 4px 3px 10px;font-size:13px}
.rdt button{width:26px;height:26px;border-radius:50%;background:var(--bg);color:var(--bad)}
.ptsbox{background:var(--soft);color:var(--ink);border:1px solid var(--brand);border-radius:12px;padding:10px 12px;margin:10px 0;font-weight:500;text-align:left}
.ptsbox b{color:var(--brand)}
.mli{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;width:100%;text-align:left}
.mli .acts{flex-wrap:wrap;justify-content:flex-end}
.rule{font-size:14px;color:var(--mute);line-height:1.6}
.hrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.dpos{color:var(--brand);font-weight:700}.dneg{color:var(--bad);font-weight:700}
/* ===== Reports ===== */
.rpbar{display:grid;gap:10px;background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:14px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;background:var(--bg);padding:4px;border-radius:12px}
.seg button{padding:9px 4px;border-radius:9px;font-weight:600;font-size:14px;color:var(--mute);white-space:nowrap;min-height:40px}
.seg button.on{background:var(--brand);color:var(--on)}
.seg .ss{display:none}
.rpnav{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
.rpnav input,.rpcustom input,.rpemp select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);width:100%;min-width:0}
.rpnav .btn{min-width:46px}
.rplab{font-weight:700;font-size:17px}
.rpcustom{display:grid;grid-template-columns:1fr 1fr;gap:10px}.rpcustom .f,.rpemp{margin:0}
.rppre{display:flex;flex-wrap:wrap;gap:6px}.rppre .btn{padding:7px 12px;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:2px;min-width:0;align-content:start}
.kpi span{font-size:13px;color:var(--mute)}
.kpi b{font-size:clamp(20px,5.2vw,28px);line-height:1.2;overflow-wrap:anywhere}
.kpi small{font-size:12px;color:var(--mute)}
.kpi.main{background:var(--brand);border-color:var(--brand);color:var(--on)}.kpi.main span,.kpi.main small{color:inherit;opacity:.85}
.kpi.neg b,.kpi.rf b{color:var(--bad)}
.rtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.rtab{padding:9px 14px;border-radius:99px;background:var(--sf);border:1px solid var(--line);font-weight:600;font-size:14px}
.rtab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chart{display:flex;align-items:flex-end;gap:3px;height:190px;border-bottom:1px solid var(--line);margin-top:8px}
.cb{flex:1 1 0;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:0}
.cb i{display:block;width:100%;max-width:38px;background:var(--brand);border-radius:5px 5px 0 0}
.cb.neg i{background:var(--bad)}
.cb em{font-style:normal;font-size:10px;color:var(--mute);white-space:nowrap;margin-bottom:2px}
.cl{display:flex;gap:3px;margin:4px 0 6px}.cl span{flex:1 1 0;min-width:0;font-size:10px;text-align:center;color:var(--mute);overflow:hidden;white-space:nowrap}
.tw{overflow-x:auto}
table.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb th{text-align:right;color:var(--mute);font-weight:500;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;vertical-align:top}
.tb th:first-child,.tb td:first-child{text-align:left}.tb td:first-child{white-space:normal;min-width:120px}
.bar2{height:6px;border-radius:9px;background:var(--bg);margin-top:6px;overflow:hidden}.bar2 s{display:block;height:100%;background:var(--brand)}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--brand);vertical-align:middle}
.badge.bad{background:rgba(200,65,47,.15);color:var(--bad)}
.rcrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.rcrow .rs{display:flex;flex-wrap:wrap;gap:6px;grid-column:1/-1}.rcrow .rs .btn{padding:7px 12px;font-size:13px}
.rfbox{border:1px solid var(--bad);border-radius:12px;padding:10px 12px;margin:10px 0;text-align:left}
@media(max-width:560px){.seg .sl{display:none}.seg .ss{display:inline}.seg button{font-size:13px;padding:9px 2px}.kpi.main{grid-column:1/-1}.rpcustom{grid-template-columns:1fr 1fr}}
</style>

<body>
<div id="login" role="dialog" aria-modal="true" aria-labelledby="lg-title">
  <div class="lgbox">
    <div class="lglogo" id="lg-logo">🧋</div>
    <h1 id="lg-title">Tea Counter</h1>
    <div class="mut">เลือกวิธีเข้าใช้งาน</div>
    <div class="f"><label for="lg-name">ชื่อพนักงาน (ไม่บังคับ · ใช้ในรายงานยอดขายตามพนักงาน)</label><input id="lg-name" autocomplete="off" placeholder="เช่น แนน"></div>
    <button class="btn pri big lgstaff" data-act="loginstaff">👤 พนักงาน · เข้าใช้งานทันที</button>

    <div class="lgerr" id="lg-err" role="alert"></div>
    <button class="btn big lgowner" data-act="loginowner">👑 เข้าสู่ระบบเจ้าของร้าน</button>

</div>
<header class="top">
  <div class="brand" id="brand" data-act="settings" title="แตะเพื่อเปลี่ยนชื่อร้าน (เจ้าของ)">Tea Counter</div>
  <nav class="tabs">
    <button class="tab" data-act="nav" data-v="pos"><span class="ti">🛒</span><span class="tl">ขายหน้าร้าน</span><span class="ts">ขาย</span></button>
    <button class="tab" data-act="nav" data-v="mem"><span class="ti">👥</span><span class="tl">สมาชิก</span><span class="ts">สมาชิก</span></button>
    <button class="tab own" data-act="nav" data-v="menu"><span class="ti">📋</span><span class="tl">จัดการเมนู</span><span class="ts">เมนู</span></button>
    <button class="tab own" data-act="nav" data-v="opt"><span class="ti">➕</span><span class="tl">ตัวเลือกเสริม</span><span class="ts">ตัวเลือก</span></button>
    <button class="tab own" data-act="nav" data-v="stock"><span class="ti">📦</span><span class="tl">สต็อก</span><span class="ts">สต็อก</span></button>
    <button class="tab own" data-act="nav" data-v="rep"><span class="ti">📊</span><span class="tl">ยอดขาย / รายงาน</span><span class="ts">รายงาน</span></button>
  </nav>
  <div class="tools">
    <span id="sync" class="syncb wait">⏳</span>
    <button class="btn" id="shiftbtn" data-act="shiftbtn">เปิดกะ</button>
    <button class="btn own setbtn" data-act="settings">ตั้งค่า</button>
    <button class="btn" id="rolebtn" data-act="usermenu" aria-haspopup="dialog" aria-label="เมนูผู้ใช้">👤</button>
  </div>
</header>
<div id="alert"></div>
<main id="app"></main>
<div class="ov" id="modal"><div class="sheet"></div></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>'฿'+(Number(n)||0).toLocaleString('th-TH');
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const hue=s=>[...s].reduce((a,c)=>a*31+c.charCodeAt(0),7)%360;

/* ---- Storage layer: LocalStorage now. To use Firebase, replace get/set with
   Firestore reads/writes on collections "menu" and "orders" (same JSON shapes). ---- */
const store={mem:{},
  get(k,d){try{const v=localStorage.getItem(k);if(v)return JSON.parse(v)}catch(e){}return k in this.mem?this.mem[k]:d},
  set(k,v){this.mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

const mk=(name,cat,price,emoji,tops=[],free=0,extra=0)=>({id:uid(),name,cat,price,emoji,tops,free,extra});
const seed=()=>{const T=['ไข่มุก','เจลลี่','พุดดิ้ง','วิปครีม','บราวน์ชูการ์'];return[
 mk('ชานมไข่มุก','ชา',45,'🧋',T,2,10),mk('ชาไทยเย็น','ชา',40,'🥤',T,2,10),
 mk('มัทฉะลาเต้','ชา',55,'🍵',['ไข่มุก','เจลลี่','วิปครีม'],1,10),
 mk('โกโก้เย็น','ชา',45,'🍫',['ไข่มุก','วิปครีม','มาร์shmallow'.replace('shmallow','ชเมลโลว์')],2,10),
 mk('ลาเต้เย็น','กาแฟ',55,'☕',['ช็อตเอสเปรสโซ','วิปครีม','ไซรัปวานิลลา'],1,15),
 mk('อเมริกาโน่','กาแฟ',45,'🧊',['ช็อตเอสเปรสโซ'],0,15),
 mk('ขนมปังปิ้งเนยนม','ของหวาน',35,'🍞'),mk('เค้กช็อกโกแลต','ของหวาน',65,'🍰')]};

let menu=store.get('pos.menu',null)||seed(), orders=store.get('pos.orders',[]), members=store.get('pos.members',[]);
store.set('pos.menu',menu);
let cart=[],billMem=null,rdm=[],cat='ทั้งหมด',view='pos',repDate=ymd(new Date()),cartOpen=false,ctx={},mr=null,askRes=null;
const catList=()=>['ทั้งหมด',...new Set(menu.map(p=>p.cat))];
let disc={t:'amt',v:0},note='',otype='',held=store.get('pos.held',[]),shift=store.get('pos.shift',null),shifts=store.get('pos.shifts',[]),ings=store.get('pos.ings',[]),sess0=(()=>{try{const s=JSON.parse(localStorage.getItem('pos.session')||'null');return s&&(s.role==='owner'||s.role==='cashier')?s.role:null}catch(e){return null}})(),role=sess0||'cashier';
document.body.dataset.role=role;document.body.dataset.auth=sess0?'in':'out';
let staffName=(()=>{try{const s=JSON.parse(localStorage.getItem('pos.session')||'null');return s&&s.name?String(s.name):''}catch(e){return ''}})();
const resetBill=()=>{disc={t:'amt',v:0};note='';otype='';billMem=null;rdm=[]};
const curOT=()=>{const L=shop.otypes||[],t=L.find(x=>x.id===otype)||L[0];return t?t.name:''};
const cartSub=()=>cart.reduce((a,c)=>a+c.unit*c.qty,0);
const cartCost=()=>cart.reduce((a,c)=>a+(c.cost||0)*c.qty,0);
const discAmt=()=>{const s=cartSub();return Math.min(s,disc.t==='pct'?Math.round(s*disc.v)/100:disc.v)};
const cartTotal=()=>cartSub()-discAmt()-rdmDisc();

const PM={cash:'เงินสด',qr:'PromptPay',card:'บัตร'},tm=t=>new Date(t).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}),idesc=i=>i.desc||(i.tops&&i.tops.length?[i.tops.join(', ')]:[]);
let shop=Object.assign({name:'Tea Counter',foot:'ขอบคุณที่ใช้บริการ',paper:58,low:5,pin:'1234',logo:'',info:'',qr:'',pad:2,otypes:[{id:'dine',name:'ทานที่ร้าน'},{id:'take',name:'สั่งกลับบ้าน'},{id:'deliv',name:'เดลิเวอรี'}]},store.get('pos.shop',{}));
let DL=null;if(window.claude&&claude.use)claude.use('downloads').then(d=>DL=d).catch(()=>{});
let groups=store.get('pos.groups',null);
if(!groups){
  groups=[];
  menu.forEach(p=>{
    if(p.tops&&p.tops.length){const k=JSON.stringify([p.tops,p.free,p.extra]);let g=groups.find(x=>x.k===k);
      if(!g){g={id:uid(),k,name:'ท็อปปิ้ง ('+p.name+')',multi:true,free:p.free||0,extra:p.extra||0,opts:p.tops};groups.push(g)}
      p.gids=[g.id]}
    delete p.tops;delete p.free;delete p.extra;p.gids=p.gids||[];
  });
  const sg={id:uid(),name:'ระดับความหวาน',multi:false,free:1,extra:0,opts:['0%','25%','50%','75%','100%']};
  groups.push(sg);menu.forEach(p=>{if(p.cat!=='ของหวาน')p.gids.push(sg.id)});
  store.set('pos.groups',groups);store.set('pos.menu',menu);
}
const gs=p=>(p.gids||[]).map(i=>groups.find(g=>g.id===i)).filter(Boolean);
const pic=p=>p.img?`<img src="${p.img}" alt="">`:esc(p.emoji||'🍽️');
/* spOn(): setting 'คิดราคาพิเศษแยก'. ON  = option with its own price is charged its own price and is NOT counted in the free quota / over-quota fee.
                                     OFF = own price ignored; option counts like any other (free quota, then over-quota fee). */
/* Per-option switch: g.sp[option]===false means OFF. Absent/true = ON (needs a price > 0).
   ON  -> charged its own price once; NOT counted in the free quota and never in the over-quota fee, whatever its order.
   OFF -> own price ignored; counted like any normal option (free X first, then extra per item). */
const isSp=(g,o)=>((g.price&&g.price[o])||0)>0&&!(g.sp&&g.sp[o]===false);
const regN=(g,s)=>s.filter(o=>!isSp(g,o)).length;
function calc(p,sel){let xc=0,bp=0,mc=p.cost||0;const desc=[],dp=[],mods=[];gs(p).forEach(g=>{const s=sel[g.id]||[];if(!s.length)return;xc+=Math.max(0,regN(g,s)-(g.free||0))*(g.extra||0);let rn=0;const pr=[];s.forEach(o=>{mc+=(g.cost&&g.cost[o])||0;if(isSp(g,o)){bp+=g.price[o];pr.push(o+' (+'+fmt(g.price[o])+')');mods.push({g:g.name,o,r:g.price[o]})}else{rn++;const ov=rn>(g.free||0)&&g.extra;pr.push(ov?o+' (+'+fmt(g.extra)+')':o);mods.push({g:g.name,o,r:ov?g.extra:0})}});desc.push(g.name+': '+s.join(', '));dp.push(g.name+': '+pr.join(', '))});return{xc,bp,desc,dp,mods,unit:(Number(p.price)||0)+bp+xc,cost:mc}}


/* ---- Modal / toast ---- */
function paint(){if(mr){$('#modal .sheet').innerHTML=mr();if(mr===checkoutView)upd()}}
function modal(fn){mr=fn;paint();$('#modal').classList.add('on')}
function close(){mr=null;if(askRes){askRes(false);askRes=null}$('#modal').classList.remove('on')}
const ask=(msg,ok='ยืนยัน')=>new Promise(r=>{askRes=r;modal(()=>`<h3>${esc(msg)}</h3><div class="foot"><button class="btn" data-act="close">ยกเลิก</button><button class="btn pri" data-act="askyes">${ok}</button></div>`)});
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200)}

/* ---- POS view ---- */
function render(){renderAlert();refreshShift();
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  if(!catList().includes(cat))cat='ทั้งหมด';
  $('#app').innerHTML=view==='pos'?'<div class="pos"><section><input id="q" type="search" class="sbox" placeholder="🔍 ค้นหาเมนู" autocomplete="off"><div class="cats" id="cats"></div><div class="grid" id="grid"></div></section><aside class="cart" id="cart"></aside></div>':view==='menu'?menuView():view==='opt'?optView():view==='stock'?stockView():view==='mem'?memView():repView();
  if(view==='pos'){$('#q').value=query;renderGrid();renderCart()}
}
function renderGrid(){
  $('#cats').innerHTML=catList().map(c=>`<button class="cat ${c===cat?'on':''}" data-act="setcat" data-c="${esc(c)}">${esc(c)}</button>`).join('');
  const qq=query.toLowerCase(),list=menu.filter(p=>(cat==='ทั้งหมด'||p.cat===cat)&&(!qq||(p.name+' '+p.cat).toLowerCase().includes(qq)));
  $('#grid').innerHTML=list.length?list.map(p=>`<button class="card" data-act="pick" data-id="${p.id}"><div class="pic" style="--h:${hue(p.name)}">${pic(p)}</div><b>${esc(p.name)}</b><span class="price">${fmt(p.price)}</span>${gs(p).length?'<span class="mut">มีตัวเลือกเสริม</span>':''}${p.stock!=null?`<span class="mut" ${p.stock<=shop.low?'style="color:var(--bad);font-weight:600"':''}>คงเหลือ ${p.stock}</span>`:''}</button>`).join(''):'<div class="empty">ยังไม่มีเมนูในหมวดนี้ เพิ่มได้ที่หน้าจัดการเมนู</div>';
}
function renderCart(){
  syncRdm();const n=cart.reduce((a,c)=>a+c.qty,0),t=cartTotal(),sub=cartSub(),da=discAmt(),rd=rdmDisc(),cs=cartCost(),rw='style="display:flex;justify-content:space-between"';
  $('#cart').classList.toggle('open',cartOpen);
  $('#cart').innerHTML=`<button class="cart-h" data-act="togglecart"><b>ตะกร้า (${n})</b><b>${fmt(t)}</b></button>
  <div class="lines">${cart.length?cart.map((c,i)=>`<div class="ln"><div><b>${esc(c.name)}</b><div class="mut">${c.desc.length?esc((c.dp||c.desc).join(' / ')):'ไม่มีตัวเลือกเสริม'}${c.bp?`<br>ราคาตัวเลือกเสริมพื้นฐาน +${fmt(c.bp)}`:''}${c.xc?`<br>ค่าตัวเลือกเสริมที่เลือกเกินฟรี +${fmt(c.xc)}`:''}</div></div>${c.rid?`<button class="btn bad" data-act="rdmdel" data-id="${c.rid}">ยกเลิก</button>`:`<div class="qty"><button data-act="dec" data-i="${i}" aria-label="ลด">−</button><span>${c.qty}</span><button data-act="inc" data-i="${i}" aria-label="เพิ่ม">+</button></div>`}<b>${fmt(c.unit*c.qty)}</b></div>`).join(''):'<div class="empty">แตะเมนูเพื่อเริ่มออเดอร์</div>'}</div>
  <div class="cart-f">${(da||rd)?`<div class="mut" ${rw}><span>ยอดก่อนลด</span><span>${fmt(sub)}</span></div>`:''}${da?`<div class="mut" ${rw}><span>ส่วนลด${disc.t==='pct'?' '+disc.v+'%':''}</span><span>-${fmt(da)}</span></div>`:''}${rd?`<div class="mut" ${rw}><span>ส่วนลดแลกแต้ม</span><span>-${fmt(rd)}</span></div>`:''}${note?`<div class="mut">หมายเหตุ: ${esc(note)}</div>`:''}
  ${memBlock()}${otypeBar()}<div class="tot"><span>ยอดรวม</span><span>${fmt(t)}</span></div>
  <div class="own mut">ต้นทุน ${fmt(cs)} · กำไร ${fmt(t-cs)} (${t?((t-cs)/t*100).toFixed(1):0}%)</div>
  <button class="btn pri big" data-act="checkout" ${cart.length?'':'disabled'}>ชำระเงิน</button>
  <button class="btn" data-act="printorder" ${cart.length?'':'disabled'}>🖨 พิมพ์ใบสั่งทำ (ก่อนชำระเงิน)</button>
  <div class="two"><button class="btn" data-act="discount">ส่วนลด/หมายเหตุ</button><button class="btn" data-act="hold" ${cart.length?'':'disabled'}>พักบิล</button></div>
  <div class="two"><button class="btn" data-act="heldlist">บิลที่พัก (${held.length})</button><button class="btn" data-act="clear" ${cart.length?'':'disabled'}>ล้างตะกร้า</button></div></div>`;
}
function addToCart(p,sel,qty=1){

/* ================= Members & Points (สมาชิกและสะสมแต้ม) =================
   - ข้อมูลสมาชิก {id=เบอร์โทร, phone, name, points, ts, log[]} เก็บที่ LocalStorage 'pos.members' และซิงก์ Firestore collection "members"

const PT_STEP=50;
const RD={d10:{p:5,v:10,l:'ลด ฿10'},d20:{p:10,v:20,l:'ลด ฿20'},snack:{p:10,v:0,l:'ขนมฟรี'}};

function maskPhone(p){p=digits(p);return p.length===10?p.slice(0,3)+'-xxx-'+p.slice(6):(p.length>4?'x'.repeat(p.length-4)+p.slice(-4):p)}
const memFind=q=>{const l=String(q||'').trim().toLowerCase(),d=digits(q);return members.filter(m=>!l||String(m.name||'').toLowerCase().includes(l)||(d&&m.phone.includes(d)))};

/* keep redemptions valid when cart / discount / member changes */
function syncRdm(){
  if(billMem&&!curMem()){billMem=null;rdm=[]}
  if(!billMem&&(rdm.length||cart.some(c=>c.rid))){rdm=[]}
  const before=rdm.length;
  rdm=rdm.filter(r=>r.t!=='snack'||cart.some(c=>c.rid===r.id));
  cart=cart.filter(c=>!c.rid||rdm.some(r=>r.id===c.rid));
  let room=cartSub()-discAmt(),used=0;const keep=[];
  rdm.forEach(r=>{const v=RD[r.t].v;if(!v){keep.push(r);return}if(used+v<=room){used+=v;keep.push(r)}});
  rdm=keep;
  const m=curMem();
  if(m){while(rdmPts()>m.points&&rdm.length){const r=rdm.pop();cart=cart.filter(c=>c.rid!==r.id)}}
  if(rdm.length!==before)toast('ปรับสิทธิ์แลกแต้มให้ตรงกับยอดบิลแล้ว');
}

/* ================= Sales Reports & Refunds (รายงานยอดขาย / คืนเงิน) ================= */
const pdate=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]):new Date(new Date().setHours(0,0,0,0))};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const fr=n=>{n=Math.round((Number(n)||0)*100)/100;return (n<0?'-':'')+fmt(Math.abs(n))};
const shortN=v=>Math.abs(v)>=1000?(Math.round(v/100)/10)+'k':String(Math.round(v));
const subOf=o=>o.sub!=null?o.sub:o.items.reduce((a,i)=>a+i.unit*i.qty,0);
const empOf=o=>o.emp||'ไม่ระบุ';
const empLabel=()=>role==='owner'?'เจ้าของร้าน':(staffName||'พนักงาน');
const catOf=it=>it.cat||((menu.find(p=>p.id===it.pid)||menu.find(p=>p.name===it.name)||{}).cat)||'อื่น ๆ';
const MN=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const bno=o=>'#'+String(o.no).padStart(3,'0');

/* ---- refund helpers (o.refunds=[{id,ts,by,shift,items:[{i,q,amt,cb}],amt,rs,full,note,pa,pr,pd}]) ---- */
const refAmt=o=>(o.refunds||[]).reduce((a,r)=>a+(r.amt||0),0);
const refPd=o=>(o.refunds||[]).reduce((a,r)=>a+(r.pd||0),0);
function refRem(o){const rem=o.items.map(i=>i.qty);(o.refunds||[]).forEach(r=>r.items.forEach(x=>{rem[x.i]=Math.max(0,(rem[x.i]||0)-x.q)}));return rem}
function rfState(o){if(!(o.refunds||[]).length)return '';return refRem(o).every(q=>q<=0)?'full':'partial'}
function restockLeft(o){const rem=o.items.map(i=>i.qty);(o.refunds||[]).forEach(r=>{if(r.rs)r.items.forEach(x=>{rem[x.i]=Math.max(0,rem[x.i]-x.q)})});return o.items.map((it,i)=>({...it,qty:rem[i]})).filter(x=>x.qty>0)}
/* refund per line = unit x qty x (bill total / bill subtotal)  -> bill-level discounts are shared fairly; the last refund settles to the exact remainder */
function refPlan(o,sel){
  const rem=refRem(o),sub=subOf(o),f=sub?o.total/sub:1,prev=refAmt(o),items=[];let sum=0,all=true;
  o.items.forEach((it,i)=>{const q=Math.max(0,Math.min(Number(sel[i])||0,rem[i]));if(rem[i]-q>0)all=false;if(q>0){const a=Math.round(it.unit*q*f*100)/100;items.push({i,q,amt:a});sum+=a}});
  if(all&&items.length){const target=Math.max(0,Math.round((o.total-prev)*100)/100),d=Math.round((target-sum)*100)/100,l=items[items.length-1];l.amt=Math.max(0,Math.round((l.amt+d)*100)/100);sum=target}
  return {items,amt:Math.round(sum*100)/100,all:all&&items.length>0}
}
function refPts(o,pl){const prevAdj=(o.refunds||[]).reduce((a,r)=>a+(r.pa||0),0),after=ptsOf(o.total-refAmt(o)-pl.amt)-(o.pe||0);return{pa:after-prevAdj,pr:pl.all?(o.pu||0):0}}
function refBox(o,fresh){
  const st=rfState(o);let h='';
  if(st)h+=`<div class="rfbox"><b class="dneg">${st==='full'?'คืนเงินแล้ว':'คืนเงินบางส่วน'}</b> · รวม ${fmt(refAmt(o))}${o.refunds.map(r=>`<div class="mut">${dt2(r.ts)} · ${fmt(r.amt)} · ${esc(r.items.map(x=>(o.items[x.i]?o.items[x.i].name:'?')+' ×'+x.q).join(', '))}${r.by?' · โดย '+esc(r.by):''}${r.note?' · '+esc(r.note):''}</div>`).join('')}</div>`;

const T0=ymd(new Date());
let rp={mode:'day',anchor:T0,from:ymd(addD(new Date(),-6)),to:T0,emp:'',tab:'sum',met:'net'};
function rpRange(){
  const A0=pdate(rp.anchor);let a,b;
  if(rp.mode==='day'){a=A0;b=addD(A0,1)}
  else if(rp.mode==='week'){a=addD(A0,-((A0.getDay()+6)%7));b=addD(a,7)}
  else if(rp.mode==='month'){a=new Date(A0.getFullYear(),A0.getMonth(),1);b=new Date(A0.getFullYear(),A0.getMonth()+1,1)}
  else if(rp.mode==='year'){a=new Date(A0.getFullYear(),0,1);b=new Date(A0.getFullYear()+1,0,1)}
  else{a=pdate(rp.from);b=addD(pdate(rp.to),1);if(b<=a)b=addD(a,1)}
  return{a:+a,b:+b,from:ymd(a),to:ymd(addD(b,-1)),emp:rp.emp}
}
function rpLabel(R){
  const A0=pdate(rp.anchor),f=(d,o)=>d.toLocaleDateString('th-TH',o);
  if(rp.mode==='day')return f(A0,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  if(rp.mode==='week'){const s=new Date(R.a),e=addD(new Date(R.b),-1);return f(s,{day:'numeric',month:'short'})+' – '+f(e,{day:'numeric',month:'short',year:'numeric'})}
  if(rp.mode==='month')return f(A0,{month:'long',year:'numeric'});
  if(rp.mode==='year')return 'ปี '+f(A0,{year:'numeric'});
  return f(pdate(R.from),{day:'numeric',month:'short',year:'numeric'})+' – '+f(pdate(R.to),{day:'numeric',month:'short',year:'numeric'});
}
const granOf=R=>{const days=Math.round((R.b-R.a)/864e5);return rp.mode==='day'||days<=1?'h':rp.mode==='year'?'m':rp.mode==='custom'?(days<=62?'d':'m'):'d'};
function rpData(R){
  const SO=[],SL=[],RF=[],RL=[];
  orders.forEach(o=>{
    if(R.emp&&empOf(o)!==R.emp)return;
    const sub=subOf(o),f=sub?o.total/sub:1;
    if(o.ts>=R.a&&o.ts<R.b){SO.push(o);o.items.forEach((it,i)=>SL.push({o,it,i,q:it.qty,g:it.unit*it.qty,n:it.unit*it.qty*f,c:(it.cost||0)*it.qty}))}
    (o.refunds||[]).forEach(r=>{if(r.ts>=R.a&&r.ts<R.b){RF.push({o,r});r.items.forEach(x=>RL.push({o,r,x,it:o.items[x.i]||{name:'(รายการถูกลบ)',unit:0,qty:0}}))}});
  });
  return{SO,SL,RF,RL};
}
const rpOrders=()=>rpData(rpRange()).SO.sort((a,b)=>a.ts-b.ts);
const cbOf=r=>r.items.reduce((a,x)=>a+(x.cb||0),0);
function rpMetrics(D){
  const m={gross:0,disc:0,total:0,cost:0,ref:0,cb:0,bills:D.SO.length,refN:D.RF.length};
  D.SO.forEach(o=>{m.gross+=subOf(o);m.disc+=(o.disc||0)+(o.rdisc||0);m.total+=o.total;m.cost+=o.cost||0});
  D.RF.forEach(({r})=>{m.ref+=r.amt||0;m.cb+=cbOf(r)});
  m.net=m.total-m.ref;m.profit=m.total-m.cost-m.ref+m.cb;m.avg=m.bills?m.net/m.bills:0;return m;
}
function buckets(R,g,D){
  const L=[],ix={},z=()=>({net:0,profit:0,bills:0});
  if(g==='h')for(let h=0;h<24;h++){ix[h]=L.length;L.push({l:pad(h),t:pad(h)+':00 – '+pad(h)+':59',...z()})}
  else if(g==='d')for(let d=new Date(R.a);d.getTime()<R.b;d.setDate(d.getDate()+1)){ix[ymd(d)]=L.length;L.push({l:String(d.getDate()),t:d.toLocaleDateString('th-TH',{weekday:'short',day:'numeric',month:'short'}),...z()})}
  else{const s=new Date(R.a);for(let d=new Date(s.getFullYear(),s.getMonth(),1);d.getTime()<R.b;d.setMonth(d.getMonth()+1)){ix[d.getFullYear()+'-'+pad(d.getMonth()+1)]=L.length;L.push({l:MN[d.getMonth()],t:d.toLocaleDateString('th-TH',{month:'long',year:'numeric'}),...z()})}}
  const kf=ts=>{const d=new Date(ts);return g==='h'?d.getHours():g==='d'?ymd(d):d.getFullYear()+'-'+pad(d.getMonth()+1)};
  D.SO.forEach(o=>{const b=L[ix[kf(o.ts)]];if(!b)return;b.net+=o.total;b.profit+=o.total-(o.cost||0);b.bills++});
  D.RF.forEach(({r})=>{const b=L[ix[kf(r.ts)]];if(!b)return;b.net-=r.amt;b.profit-=r.amt-cbOf(r)});
  return L;
}

/* ---- generic aggregations ---- */
function lineAgg(D,kf){
  const A0={},get=it=>{const k=kf(it);return A0[k]||(A0[k]={k,cat:catOf(it),q:0,n:0,c:0,rq:0,ra:0,cb:0})};
  D.SL.forEach(s=>{const a=get(s.it);a.q+=s.q;a.n+=s.n;a.c+=s.c});
  D.RL.forEach(({it,x})=>{const a=get(it);a.q-=x.q;a.rq+=x.q;a.ra+=x.amt;a.cb+=x.cb||0});
  return Object.values(A0).map(a=>({...a,net:a.n-a.ra,pf:a.n-a.c-a.ra+a.cb})).sort((a,b)=>b.net-a.net);
}
function ordAgg(D,kf){
  const A0={},get=o=>{const k=kf(o);return A0[k]||(A0[k]={k,b:0,t:0,c:0,r:0,cb:0})};
  D.SO.forEach(o=>{const a=get(o);a.b++;a.t+=o.total;a.c+=o.cost||0});
  D.RF.forEach(({o,r})=>{const a=get(o);a.r+=r.amt;a.cb+=cbOf(r)});
  return Object.values(A0).map(a=>({...a,net:a.t-a.r,pf:a.t-a.c-a.r+a.cb})).sort((a,b)=>b.net-a.net);
}
function modAgg(D){
  const A0={},get=m=>{const k=m.g+'|'+m.o;return A0[k]||(A0[k]={g:m.g,o:m.o,q:0,rev:0})};
  const modsOf=it=>it.mods||(()=>{const sel=selOf(it),out=[];groups.forEach(g=>{let rn=0;(sel[g.id]||[]).forEach(o=>{if(isSp(g,o))out.push({g:g.name,o,r:g.price[o]});else{rn++;out.push({g:g.name,o,r:rn>(g.free||0)&&g.extra?g.extra:0})}})});return out})();
  D.SL.forEach(s=>modsOf(s.it).forEach(m=>{const a=get(m);a.q+=s.q;a.rev+=(m.r||0)*s.q}));
  D.RL.forEach(({it,x})=>modsOf(it).forEach(m=>{const a=get(m);a.q-=x.q;a.rev-=(m.r||0)*x.q}));
  return Object.values(A0).filter(a=>a.q>0||a.rev).sort((a,b)=>b.q-a.q||b.rev-a.rev);
}

/* ================= Firebase / Cloud Firestore sync =================
   - ทุกครั้งที่โค้ดเดิมเรียก store.set() ข้อมูลจะถูกเขียนลง LocalStorage ก่อนเสมอ (Fallback) แล้วค่อยส่งขึ้น Firestore
   - ถ้าโหลด SDK หรือเชื่อมต่อไม่ได้ ระบบยังทำงานแบบเครื่องเดียวต่อไปตามปกติ */
const firebaseConfig={apiKey:"AIzaSyAIS0kUvXYIR54K4kwda-f1h6O1dpAOBRQ",authDomain:"shop-pos-a171b.firebaseapp.com",projectId:"shop-pos-a171b",storageBucket:"shop-pos-a171b.firebasestorage.app",messagingSenderId:"48104147246",appId:"1:48104147246:web:1ce37cc7621387496252bf",measurementId:"G-E7JSXW6BT4"};
const SDK=[['https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/','.min.js'],['https://cdn.jsdelivr.net/npm/firebase@10.12.2/','.js']];
const FB={ok:false,db:null,live:false,ready:{}},last={};
const SY={ok:['☁','ซิงก์แล้ว','ok'],connecting:['⏳','กำลังเชื่อมต่อ','wait'],offline:['⚠','ออฟไลน์ บันทึกในเครื่อง','off'],local:['💾','โหมดเครื่องเดียว','wait']};
function setSync(k){const e=$('#sync');if(!e)return;const [i,t,c]=SY[k];e.className='syncb '+c;e.innerHTML=i+' <span class="t">'+t+'</span>';e.title=t}
const loadJS=u=>new Promise((res,rej)=>{const e=document.createElement('script');e.src=u;e.onload=res;e.onerror=rej;document.head.appendChild(e)});
const COLS={
  menu:{key:'pos.menu',get:()=>menu,put:v=>{menu=v}},
  groups:{key:'pos.groups',get:()=>groups,put:v=>{groups=v}},
  ingredients:{key:'pos.ings',get:()=>ings,put:v=>{ings=v}},
  orders:{key:'pos.orders',get:()=>orders,put:v=>{orders=v.sort((a,b)=>a.ts-b.ts)}},
  members:{key:'pos.members',get:()=>members,put:v=>{members=v}}
};
const KEYS={'pos.menu':'menu','pos.groups':'groups','pos.ings':'ingredients','pos.orders':'orders','pos.members':'members','pos.shop':'shop'};
const rawSet=store.set.bind(store);
store.set=(k,v)=>{rawSet(k,v);const c=KEYS[k];if(c)c==='shop'?pushShop(v):push(c,v)};
function fail(e){setSync('offline');console.warn('Firestore:',e);if(e&&e.code==='permission-denied')toast('Firestore ปฏิเสธการเข้าถึง ตรวจสอบ Security Rules')}
async function push(col,arr){
  if(!FB.ok||!FB.ready[col])return;
  const L=last[col]||{},cur={},ops=[];
  arr.forEach(x=>{if(!x||!x.id)return;const j=JSON.stringify(x);cur[x.id]=j;if(L[x.id]!==j)ops.push([x.id,JSON.parse(j)])});
  Object.keys(L).forEach(id=>{if(!(id in cur))ops.push([id,null])});
  last[col]=cur;
  try{for(let i=0;i<ops.length;i+=400){const b=FB.db.batch();ops.slice(i,i+400).forEach(([id,d])=>{const r=FB.db.collection(col).doc(id);d?b.set(r,d):b.delete(r)});await b.commit()}}
  catch(e){last[col]=L;fail(e)}
}
function pushShop(v){
  if(!FB.ok||!FB.ready.shop)return;
  FB.db.collection('settings').doc('shop').set({name:v.name||'',foot:v.foot||'',paper:Number(v.paper)||58,low:Number(v.low)||0,otypes:(v.otypes||[]).map(x=>({id:x.id,name:x.name})),logo:v.logo||'',info:v.info||'',qr:v.qr||'',pad:v.pad==null||isNaN(v.pad)?2:Number(v.pad)}).catch(fail);
}
function refreshUI(){
  const a=document.activeElement;
  if(mr||(a&&a.matches&&a.matches('#app input,#app textarea')))return renderAlert();
  render();
}
function listen(col){
  const C=COLS[col];let first=true;
  FB.db.collection(col).onSnapshot({includeMetadataChanges:true},snap=>{
    const cached=snap.metadata.fromCache;
    if(!cached){FB.live=true;setSync('ok')}else setSync(FB.live?'offline':'connecting');
    if(first){
      if(cached&&snap.empty)return;
      first=false;
      if(snap.empty){FB.ready[col]=true;push(col,C.get());return}
    }else if(snap.metadata.hasPendingWrites||!snap.docChanges().length)return;
    C.put(snap.docs.map(d=>d.data()));rawSet(C.key,C.get());
    last[col]=Object.fromEntries(C.get().filter(x=>x&&x.id).map(x=>[x.id,JSON.stringify(x)]));
    FB.ready[col]=true;refreshUI();
  },fail);
}
async function startSync(){
  setSync('connecting');
  try{
    for(const [b,x] of SDK){try{await loadJS(b+'firebase-app-compat'+x);await loadJS(b+'firebase-firestore-compat'+x);if(window.firebase&&firebase.firestore)break}catch(e){}}
    if(!(window.firebase&&firebase.firestore))throw new Error('SDK not loaded');
    firebase.apps.length?firebase.app():firebase.initializeApp(firebaseConfig);
    FB.db=firebase.firestore();
    try{await FB.db.enablePersistence({synchronizeTabs:true})}catch(e){}
    FB.ok=true;
    Object.keys(COLS).forEach(listen);
    FB.db.collection('settings').doc('shop').onSnapshot(sn=>{
      if(!sn.metadata.fromCache&&!sn.exists){FB.ready.shop=true;pushShop(shop);return}
      if(sn.exists&&!sn.metadata.hasPendingWrites){shop={...shop,...sn.data()};rawSet('pos.shop',shop);FB.ready.shop=true;refreshShift();renderAlert()}
    },fail);
    setTimeout(()=>{if(!FB.live)setSync('offline')},8000);
    addEventListener('offline',()=>setSync('offline'));
    addEventListener('online',()=>setSync(FB.live?'ok':'connecting'));
  }catch(e){FB.ok=false;setSync('local');console.warn('Firebase disabled, using LocalStorage only:',e)}
}
